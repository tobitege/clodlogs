name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-desktop:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Clodlogs.sln

      - name: Build
        run: dotnet build Clodlogs.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project src/Clodlogs.Desktop.Tests/Clodlogs.Desktop.Tests.csproj -c Release --no-build
